name: ⚓ Anclora | Auto Recover Main

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Cada noche a las 03:00 UTC

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧭 Detect divergence between production and main
        id: divergence-check
        run: |
          git fetch origin
          PROD_COMMITS=$(git rev-list --left-right --count origin/production...origin/main | cut -f1)
          echo "PROD_COMMITS=$PROD_COMMITS" >> $GITHUB_OUTPUT
          if [ "$PROD_COMMITS" -gt 0 ]; then
            echo "Detected divergence; triggering recovery"
            echo "needs_recovery=true" >> $GITHUB_OUTPUT
          else
            echo "No divergence detected"
            echo "needs_recovery=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Restore main from production
        if: ${{ steps.divergence-check.outputs.needs_recovery == 'true' }}
        shell: pwsh
        id: recovery-step
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🔄 Starting recovery process..."
          Write-Host "📊 PROD_COMMITS: ${{ steps.divergence-check.outputs.PROD_COMMITS }}"

          if (Test-Path "scripts/anclora_git_recover_cli.ps1") {
            try {
              ./scripts/anclora_git_recover_cli.ps1 `
                -Mode ProductionToMain `
                -AutoConfirm $true
              Write-Host "✅ Recovery completed successfully"
              echo "recovery_status=success" >> $env:GITHUB_OUTPUT
            }
            catch {
              Write-Host "❌ Recovery failed: $($_.Exception.Message)"
              Write-Host "Stack trace: $($_.ScriptStackTrace)"
              echo "recovery_status=failed" >> $env:GITHUB_OUTPUT
              exit 1
            }
          } else {
            Write-Host "❌ Error: Recovery script not found at scripts/anclora_git_recover_cli.ps1"
            Write-Host "📁 Current directory: $(Get-Location)"
            Write-Host "📂 Available scripts:"
            if (Test-Path "scripts") {
              Get-ChildItem "scripts" | ForEach-Object { Write-Host "  - $($_.Name)" }
            } else {
              Write-Host "  No scripts directory found"
            }
            echo "recovery_status=script_not_found" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: ✅ Summary
        shell: pwsh
        run: |
          Write-Host "🕒 Recovery process completed at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC') -UFormat '%z'"

          $needsRecovery = "${{ steps.divergence-check.outputs.needs_recovery }}"
          $prodCommits = "${{ steps.divergence-check.outputs.PROD_COMMITS }}"
          $recoveryStatus = if ("${{ steps.recovery-step.outcome }}") { "${{ steps.recovery-step.outcome }}" } else { "not_executed" }

          if ($needsRecovery -eq "false") {
            Write-Host "✅ No divergence detected between production and main branches"
            Write-Host "📊 Branch status: production and main are in sync"
          } else {
            Write-Host "🔄 Divergence detected: $prodCommits commits ahead"
            if ($recoveryStatus -eq "success") {
              Write-Host "✅ Recovery: Main branch has been synchronized with production"
            } else {
              Write-Host "❌ Recovery: Process failed or was not executed"
              Write-Host "📋 Check previous steps for detailed error information"
            }
          }

          Write-Host ""
          Write-Host "📈 Process Summary:"
          Write-Host "  • Production commits ahead: $prodCommits"
          Write-Host "  • Recovery needed: $needsRecovery"
          Write-Host "  • Recovery status: $recoveryStatus"
