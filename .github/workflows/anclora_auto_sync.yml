name: ⚓ Anclora | Auto Sync Environments

# AOS governance gate: a push to `development` only auto-promotes as far as
# `staging` (that stage's validation is the push's own CI). Promoting
# staging → production and production → main is NOT automatic — it requires
# an explicit human-triggered workflow_dispatch run with -Mode set to one of
# StagingToProduction / ProductionToMain, after that environment's own
# validation has passed. This matches CLAUDE.md: "staging → production
# (after staging validation), production → main (after production success)".
on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (leave default for the automatic dev→staging path)"
        required: false
        default: DevToStaging
        type: choice
        options:
          - DevToStaging
          - StagingToProduction
          - ProductionToMain

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔹 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Verify repository-local script exists
        run: |
          if [ ! -f "scripts/anclora_sync_envs.ps1" ]; then
            echo "❌ scripts/anclora_sync_envs.ps1 missing from repository. Aborting (no external fallback)." >&2
            exit 1
          fi

      - name: 🔄 Run sync (fast-forward only)
        shell: pwsh
        # Push events (development branch) always run DevToStaging.
        # Manual workflow_dispatch runs use the human-selected mode, which
        # is how staging→production and production→main are gated.
        run: |
          $mode = "${{ github.event_name == 'push' && 'DevToStaging' || inputs.mode }}"
          if (-not $mode) { $mode = "DevToStaging" }
          ./scripts/anclora_sync_envs.ps1 -Mode $mode

      - name: 🧾 Generate sync summary
        run: |
          echo "🧭 Sync run on $(date)" > sync_summary.txt
          git log -5 --oneline >> sync_summary.txt
          cat sync_summary.txt

      - name: 📤 Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: sync_summary
          path: sync_summary.txt
